services:
  - type: web
    name: transit-atlas
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PANEL_PASSWORD
        sync: false
      - key: ADMIN_HOST
        value: admin.transitly.eu
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: APP_ORIGIN
        value: https://transitly.eu,https://www.transitly.eu,https://transit-atlas.onrender.com,https://localhost,capacitor://localhost
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
